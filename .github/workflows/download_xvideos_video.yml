name: Download Single xvideos Video

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Video page URL (e.g., https://www.xvideos.com/... )'
        required: true
        type: string
      quality:
        description: 'Desired quality (auto picks best available)'
        required: true
        type: choice
        options:
          - '240'
          - '360'
          - '720'
          - '1080'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyppeteer beautifulsoup4 lxml httpx

      - name: Run video downloader
        run: |
          python download_xvideos_video.py \
            --url "${{ github.event.inputs.url }}" \
            --quality "${{ github.event.inputs.quality }}"

      - name: Commit and push final ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add download/
          git commit -m "Add downloaded video: ${{ github.event.inputs.url }}" || echo "No changes to commit"
          git push
