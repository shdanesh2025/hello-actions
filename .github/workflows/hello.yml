name: Download and Archive Videos

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Video URLs (one per line or comma‑separated)'
        required: true
        type: string

permissions:
  contents: write          # Needed to push the commit

jobs:
  download-and-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install xvideos_api

      - name: Download and zip videos
        run: |
          python download_and_zip.py "${{ github.event.inputs.urls }}"

      - name: Commit and push archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos_archive.zip
          git commit -m "Add video archive" || echo "No changes to commit"
          git push
